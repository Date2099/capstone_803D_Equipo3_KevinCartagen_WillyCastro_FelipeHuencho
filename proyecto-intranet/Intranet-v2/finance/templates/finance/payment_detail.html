<section class="page">
  <h2>Pago · {{p.student_name}}</h2>
  <ul>
    <li>Curso: {{p.course_name}}</li>
    <li>Periodo: {{p.period}}</li>
    <li>Monto: ${{p.amount_clp|intcomma}}</li>
    <li>Método: {{p.method}}</li>
    <li>Estado: {{p.get_status_display}}</li>
    {% if p.evidence_url %}<li>Comprobante: <a href="{{p.evidence_url}}" target="_blank">ver</a></li>{% endif %}
  </ul>
</section>
