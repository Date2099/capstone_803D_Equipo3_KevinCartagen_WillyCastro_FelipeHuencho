{% load static %}
<!doctype html>
<html lang="es" class="theme-auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intranet | Alumno</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <link rel="icon" href="{% static 'img/logo.png' %}" />
  <link rel="stylesheet" href="{% static 'student_css/studentStyle.css' %}" />

  <script>window.STATIC_URL="{{ STATIC_URL|default:'/static/' }}";</script>
</head>
<body>
  <div class="layout">
    <!-- SIDEBAR (off-canvas en móvil) -->
    <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="/" aria-label="Inicio">
        <img class="brand-logo" src="{% static 'img/logo.png' %}" alt="Logo Colegio" />
        <div class="brand-text">
          <span class="brand-title">Intranet</span>
          <small class="brand-subtitle">Portal Alumno</small>
        </div>
      </a>

      <div class="profile">
        <div class="avatar" aria-hidden="true">
          <img class="avatar-photo" src="{% static 'img/student.jpg' %}" alt="" onerror="this.style.display='none'" />
          <span class="avatar-initials">FH</span>
        </div>
        <div>
          <div class="profile-name">Felipe Huencho</div>
          <div class="profile-role">Alumno</div>
        </div>
      </div>

      <nav class="menu" role="navigation">
        <a href="#" class="active" data-section="dashboard" aria-current="page"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
        <a href="#" data-section="mis-clases"><i class="fa-solid fa-book"></i><span>Mis Clases</span></a>
        <a href="#" data-section="notas"><i class="fa-solid fa-list-check"></i><span>Notas</span></a>
        <a href="#" data-section="calendario"><i class="fa-solid fa-calendar"></i><span>Calendario</span></a>
        <a href="#" data-section="perfil"><i class="fa-solid fa-user"></i><span>Perfil</span></a>
        <a href="#" data-section="pagos"><i class="fa-solid fa-wallet"></i><span>Pagos</span></a>
      </nav>
    </aside>

    <!-- Backdrop para el drawer en móvil -->
    <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>

    <section class="main">
      <header class="topbar">
        <!-- botón hamburguesa (solo visible en móvil) -->
        <button id="btn-hamburger" class="btn-icon hamburger"
                aria-label="Abrir menú"
                aria-controls="sidebar"
                aria-expanded="false">
          <i class="fa-solid fa-bars"></i>
        </button>

        <h1 id="topbar-t" class="topbar-t">Portal alumnos</h1>
        <div class="spacer"></div>

        <button id="btn-theme" class="btn-icon" aria-label="Cambiar tema (claro/oscuro)" title="Tema">
          <i class="fa-solid fa-circle-half-stroke"></i>
        </button>

        <div class="user-mini" aria-label="Usuario">
          <span class="user-name">Felipe Huencho</span>
          <div class="avatar-mini" aria-hidden="true">FH</div>
        </div>
      </header>

      <main class="content">
        <div id="main-card" class="card" aria-live="polite"></div>
      </main>

      <footer class="footer">© Colegio San Agustín de Hipona — 2025</footer>
    </section>
  </div>

  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Diálogo">
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="document">
      <div class="modal-head">
        <h3 id="modal-title" class="modal-title">Título</h3>
        <button class="btn-icon" id="modal-close" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-foot">
        <button class="btn btn-secondary" id="modal-ok">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="{% static 'js/studentApp.js' %}"></script>
</body>
</html>
