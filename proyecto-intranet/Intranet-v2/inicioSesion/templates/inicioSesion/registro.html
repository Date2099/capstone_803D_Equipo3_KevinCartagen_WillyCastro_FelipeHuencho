{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Alumnos - Intranet</title>
  <link rel="stylesheet" href="{% static 'css/styleform.css' %}">
</head>
<body>

  <div class="container">
    <div class="form-container">

      <div class="form-header">
        <img src="{% static 'img/logo.png' %}" alt="Logo Colegio San Agustín de Hipona" class="school-logo">
        <p>Colegio San Agustín de Hipona</p>
        <h1>Registro de Alumnos</h1>
      </div>

      
      <form class="form-box">

        <div class="input-group">
          <input type="text" id="idestudiante" name="idestudiante" class="input-field" value="SAH-2025-0123" readonly>
          <label for="idestudiante" class="floating-label">ID Estudiante</label>
        </div>

        <div class="input-row">
          <div class="input-group">
            <input type="text" id="nombres" name="nombres" class="input-field" placeholder=" " required>
            <label for="nombres" class="floating-label">Nombres</label>
          </div>
          <div class="input-group">
            <input type="text" id="apellidos" name="apellidos" class="input-field" placeholder=" " required>
            <label for="apellidos" class="floating-label">Apellidos</label>
          </div>
        </div>

        <div class="input-row">
          <div class="input-group">
            <input type="text" id="rut" name="rut" class="input-field" placeholder=" " required>
            <label for="rut" class="floating-label">RUT</label>
          </div>
          <div class="input-group">
            <input type="date" id="fecha-nacimiento" name="fecha_nacimiento" class="input-field" placeholder=" " required>
            <label for="fecha-nacimiento" class="floating-label">Fecha de nacimiento</label>
          </div>
        </div>

        <h2 class="form-subtitle">Información del Apoderado</h2>

        <div class="input-row">
          <div class="input-group">
            <input type="text" id="nombre-apoderado" name="nombre_apoderado" class="input-field" placeholder=" " required>
            <label for="nombre-apoderado" class="floating-label">Nombre del Apoderado</label>
          </div>
          <div class="input-group">
            <input type="text" id="rut-apoderado" name="rut_apoderado" class="input-field" placeholder=" " required>
            <label for="rut-apoderado" class="floating-label">RUT del Apoderado</label>
          </div>
        </div>

        <div class="input-row">
          <div class="input-group">
            <input type="email" id="email-apoderado" name="email_apoderado" class="input-field" placeholder=" " required>
            <label for="email-apoderado" class="floating-label">Email del Apoderado</label>
          </div>
          <div class="input-group">
            <input type="tel" id="telefono-apoderado" name="telefono_apoderado" class="input-field" placeholder=" " required>
            <label for="telefono-apoderado" class="floating-label">Teléfono del Apoderado</label>
          </div>
        </div>

        <h2 class="form-subtitle">Información Académica y Administrativa</h2>

        <div class="input-row">
          <div class="input-group">
            <input type="text" id="comuna" name="comuna" class="input-field" placeholder=" " required>
            <label for="comuna" class="floating-label">Comuna</label>
          </div>
          <div class="input-group">
            <input type="text" id="curso" name="curso" class="input-field" placeholder=" " required>
            <label for="curso" class="floating-label">Curso</label>
          </div>
        </div>

        <div class="input-group">
          <select id="estado-alumno" name="estado_alumno" class="input-field" required>
            <option value="" disabled selected hidden></option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
            <option value="retirado">Retirado</option>
            <option value="postulante">Postulante</option>
          </select>
          <label for="estado-alumno" class="floating-label">Estado del Alumno</label>
        </div>

        <div class="input-row">
          <div class="input-group">
            <input type="number" id="monto-mensualidad" name="monto_mensualidad" class="input-field" value="230000" placeholder=" " required>
            <label for="monto-mensualidad" class="floating-label">Monto Mensualidad 2025</label>
          </div>
          <div class="input-group">
            <input type="number" id="matricula" name="matricula" class="input-field" placeholder=" " required>
            <label for="matricula" class="floating-label">Valor Matrícula</label>
          </div>
        </div>

        <button type="submit" class="form-btn form-btn--submit">Registrar Alumno</button>
      </form>
    </div>
  </div>
</body>
</html>
